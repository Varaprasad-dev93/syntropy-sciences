# Builds the site and deploys it to the existing Cloudflare Pages project
# (syntropy-sciences) on every push to main. The project was created by direct
# upload, which Cloudflare cannot convert to its own Git integration, so the
# deploy runs from here instead.
#
# Needs one repository secret: CLOUDFLARE_API_TOKEN, with the
# "Account > Cloudflare Pages > Edit" permission.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # Fails fast with a readable reason instead of wrangler's bare exit code.
      - name: Check Cloudflare token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN repository secret is missing or empty."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
            https://api.cloudflare.com/client/v4/accounts/0d751e20daf82ae0107969999724a018/pages/projects/syntropy-sciences)
          case "$code" in
            200) echo "Token can reach the syntropy-sciences Pages project." ;;
            400|401) echo "::error::Cloudflare rejected the token (HTTP $code): it is invalid, expired or was pasted incompletely."; exit 1 ;;
            403) echo "::error::The token is valid but lacks permission (HTTP 403). It needs Account > Cloudflare Pages > Edit."; exit 1 ;;
            404) echo "::error::The token cannot see the syntropy-sciences project (HTTP 404). Its Account Resources must include the account that owns the project."; exit 1 ;;
            *) echo "::error::Unexpected response from Cloudflare (HTTP $code)."; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not a secret: account IDs appear in every dashboard URL.
          accountId: 0d751e20daf82ae0107969999724a018
          command: pages deploy dist --project-name=syntropy-sciences --branch=main
